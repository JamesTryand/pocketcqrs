name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # gofmt is not enforced by `go vet`, and formatting drift is invisible
      # until someone's editor reformats a file and buries a real change in
      # whitespace.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

  # The smoke suite builds both binaries and drives a real backend and
  # dashboard over HTTP. It is where the wiring between processes is checked
  # — the place unit tests cannot reach and where this project's worst bugs
  # have lived. One platform is enough: it exercises behaviour, not
  # platform-specific code, and the unit suite already runs on both.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test -tags=smoke ./smoke/... -v -timeout 15m
