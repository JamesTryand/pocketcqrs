{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · PocketCQRS</title>
<link rel="stylesheet" href="/assets/webawesome/styles/themes/default.css">
<link rel="stylesheet" href="/assets/webawesome/styles/native.css">
<link rel="stylesheet" href="/assets/webawesome/styles/utilities.css">
<link rel="stylesheet" href="/assets/app.css">
<script>
  // Web Awesome uses explicit scheme classes; follow the OS preference.
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.replace('wa-light', 'wa-dark');
  }
</script>
<script type="module" src="/assets/webawesome/webawesome.loader.js"></script>
<script src="/assets/vendor/htmx.min.js" defer></script>
{{end}}

{{define "layout"}}
<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-default wa-light">
<head>{{template "head" .}}</head>
<body>
<wa-page>
  <header slot="header" class="wa-split">
    <div class="wa-cluster">
      <wa-button data-toggle-nav appearance="plain">Menu</wa-button>
      <strong>PocketCQRS</strong>
      <span class="wa-caption-m">ops dashboard</span>
    </div>
    <div class="wa-cluster">
      <wa-button href="{{.BackendURL}}/_/" target="_blank" rel="noopener" appearance="outlined" size="s">PocketBase admin</wa-button>
      <form method="post" action="/logout">
        <wa-button type="submit" appearance="plain" size="s">Sign out</wa-button>
      </form>
    </div>
  </header>

  <nav slot="navigation" class="wa-stack wa-gap-2xs">
    {{range .Nav}}
    <a href="{{.Href}}" data-drawer="close" class="wa-cluster wa-gap-xs{{if .Current}} nav-active{{end}}" {{if .Current}}aria-current="page"{{end}}><wa-icon name="{{.Icon}}" library="system"></wa-icon> {{.Label}}</a>
    {{end}}
  </nav>

  <main class="wa-stack wa-gap-xl">
    {{template "content" .}}
  </main>
</wa-page>
</body>
</html>
{{end}}
